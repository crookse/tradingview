# Release Drafter v7 (.github/workflows/release-drafter.yml). Shared by every
# indicator: the workflow extends it per indicator with that indicator's tag
# prefix, tag and name, and keeps only the pull requests that change it.
# Pull requests are sorted by their Conventional Commits titles, like
# "feat: photos", which also set the next version.
categories:
  - title: 'Features'
    semver-increment: 'minor'
    when:
      conventional:
        type: 'feat'
  - title: 'Fixes'
    when:
      conventional:
        type: 'fix'
  - title: 'Maintenance'
    when:
      conventional:
        types: ['chore', 'ci', 'build', 'refactor', 'docs', 'test', 'perf', 'style']
  # Anything else, like a title that isn't a conventional commit.
  - title: 'Other changes'
  # A breaking change ("feat!: …") makes the next version major.
  - type: 'version-resolver'
    semver-increment: 'major'
    when:
      conventional:
        breaking: true
  # Otherwise a patch, unless a feature made it minor.
  - type: 'version-resolver'
    semver-increment: 'patch'
change-template: '- $TITLE (#$NUMBER)'
# Add # and @ to prevent mentions. Add ` to prevent code blocks.
change-title-escapes: '\<*_&'
# ### headings, so Release Version can add the notes under a
# "## [<version>] - <date>" heading in the indicator's CHANGELOG.md.
category-template: '### $TITLE'
no-changes-template: '- No changes'
template: |
  $CHANGES
